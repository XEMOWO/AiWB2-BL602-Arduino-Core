<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Ai-WB2-12F Arduino Core — Bouffalo BL602 RISC-V SoC, 192 MHz, WiFi + BLE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="0.55" stop-color="#0e1f38"/>
      <stop offset="1" stop-color="#152c4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.30" r="0.55">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#0ea5e9" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1c2e47" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- kicker -->
  <text x="72" y="68" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="4" fill="#38bdf8">
    AI-THINKER &#183; ARDUINO CORE &#183; v0.1.0
  </text>

  <!-- title line 1: Ai-WB2-12F (gradient) -->
  <text x="70" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="800" fill="url(#titleGrad)">
    Ai-WB2-12F
  </text>

  <!-- title line 2: Arduino Core (white) -->
  <text x="73" y="206" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="3" fill="#f8fafc">
    Arduino Core
  </text>

  <!-- subtitle -->
  <text x="73" y="248" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#cbd5e1">
    ESP32-style Arduino API on the Bouffalo BL602 RISC-V SoC
  </text>

  <!-- feature icon badges -->
  <g transform="translate(666 129)">
    <rect width="72" height="72" rx="18" fill="#17324d" stroke="#2c5580" stroke-width="1.5"/>
    <circle cx="36" cy="44" r="4.5" fill="#38bdf8"/>
    <path d="M28 44 A8 8 0 0 1 44 44" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M21 44 A15 15 0 0 1 51 44" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M14 44 A22 22 0 0 1 58 44" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(750 129)">
    <rect width="72" height="72" rx="18" fill="#17324d" stroke="#2c5580" stroke-width="1.5"/>
    <!-- Bluetooth rune (user-provided icon, recolored to accent) -->
    <path d="M671.488 385.024L512.896 228.736c-12.672-12.544-34.176-3.456-34.176 14.336V439.168l-100.096-93.952c-1.408-1.408-3.712-1.28-5.12 0.128l-28.544 30.336c-1.408 1.408-1.28 3.712 0.128 5.12l133.632 125.44v18.816l-133.504 124.16c-1.408 1.408-1.536 3.712-0.128 5.12l28.416 30.464c1.408 1.408 3.712 1.536 5.12 0.128l100.224-93.184v198.912c0 17.792 21.504 26.88 34.176 14.336L671.488 648.96c7.936-7.808 7.936-20.736 0-28.672L581.12 531.328c-7.936-7.808-7.936-20.736 0-28.672l90.368-89.088c8.064-7.808 8.064-20.736 0-28.544z" fill="#a78bfa" transform="translate(-6.59 -7.44) scale(0.0852)"/>
  </g>
  <g transform="translate(834 129)">
    <rect width="72" height="72" rx="18" fill="#17324d" stroke="#2c5580" stroke-width="1.5"/>
    <!-- chip: die + pin-1 marker + pins on all four sides -->
    <circle cx="26" cy="26" r="2.2" fill="#34d399"/>
    <rect x="22" y="22" width="28" height="28" rx="4" fill="none" stroke="#34d399" stroke-width="4"/>
    <path d="M26 22 V10 M33 22 V10 M40 22 V10 M47 22 V10" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    <path d="M26 50 V62 M33 50 V62 M40 50 V62 M47 50 V62" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    <path d="M22 26 H10 M22 33 H10 M22 40 H10 M22 47 H10" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 26 H62 M50 33 H62 M50 40 H62 M50 47 H62" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- dashed connector toward the chip icon -->
  <path d="M 908 165 H 1002" stroke="#2c5580" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.8"/>

  <!-- spec chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="70" y="272" width="182" height="34" rx="17" fill="#17324d" stroke="#2c5580" stroke-width="1.5"/>
    <text x="161" y="293" text-anchor="middle" fill="#7dd3fc">RISC-V RV32IMFC</text>

    <rect x="266" y="272" width="104" height="34" rx="17" fill="#17324d" stroke="#2c5580" stroke-width="1.5"/>
    <text x="318" y="293" text-anchor="middle" fill="#7dd3fc">192 MHz</text>

    <rect x="384" y="272" width="196" height="34" rx="17" fill="#17324d" stroke="#2c5580" stroke-width="1.5"/>
    <text x="482" y="293" text-anchor="middle" fill="#7dd3fc">WiFi 802.11 b/g/n</text>

    <rect x="594" y="272" width="104" height="34" rx="17" fill="#17324d" stroke="#2c5580" stroke-width="1.5"/>
    <text x="646" y="293" text-anchor="middle" fill="#7dd3fc">BLE 5.0</text>

    <rect x="712" y="272" width="238" height="34" rx="17" fill="#17324d" stroke="#34d399" stroke-width="1.5"/>
    <text x="831" y="293" text-anchor="middle" fill="#34d399">Boards Manager install</text>
  </g>

  <!-- BL602 chip icon + caption (right lockup) -->
  <g transform="translate(1002 84) scale(1.28)">
    <!-- pcb -->
    <rect width="196" height="148" rx="16" fill="#0b1830" stroke="#2a4569" stroke-width="2.5"/>
    <!-- pins left -->
    <g fill="#1e3a5f">
      <rect x="-10" y="20" width="12" height="7" rx="2"/>
      <rect x="-10" y="44" width="12" height="7" rx="2"/>
      <rect x="-10" y="68" width="12" height="7" rx="2"/>
      <rect x="-10" y="92" width="12" height="7" rx="2"/>
    </g>
    <!-- pins right -->
    <g fill="#1e3a5f">
      <rect x="194" y="20" width="12" height="7" rx="2"/>
      <rect x="194" y="44" width="12" height="7" rx="2"/>
      <rect x="194" y="68" width="12" height="7" rx="2"/>
      <rect x="194" y="92" width="12" height="7" rx="2"/>
    </g>
    <!-- die -->
    <rect x="42" y="34" width="112" height="60" rx="8" fill="#122441" stroke="#2c5580" stroke-width="1.5"/>
    <text x="98" y="74" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">BL602</text>
    <!-- traces -->
    <path d="M48 118 H76 V108 H120 V118 H148" fill="none" stroke="#1e3a5f" stroke-width="2"/>
    <path d="M70 18 V30" stroke="#1e3a5f" stroke-width="2"/>
    <path d="M126 18 V30" stroke="#1e3a5f" stroke-width="2"/>
    <!-- LED -->
    <circle cx="172" cy="120" r="8" fill="#34d399">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="172" cy="120" r="13" fill="#34d399" opacity="0.18">
      <animate attributeName="opacity" values="0.22;0.05;0.22" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="172" y="141" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5c6b7a">LED</text>
  </g>

  <!-- BL602 caption -->
  <text x="1127" y="320" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="2" fill="#7dd3fc">BL602</text>
</svg>
