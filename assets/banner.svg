<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Ai-WB2-12F Arduino Core — Bouffalo BL602 RISC-V SoC, 192 MHz, WiFi + BLE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="0.55" stop-color="#0e1f38"/>
      <stop offset="1" stop-color="#152c4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#0ea5e9" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1c2e47" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- kicker -->
  <text x="72" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="4" fill="#38bdf8">
    AI-THINKER &#183; ARDUINO CORE &#183; v0.1.0
  </text>

  <!-- title -->
  <text x="70" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" fill="#f8fafc">
    Ai-WB2-12F
  </text>
  <text x="70" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" fill="url(#titleGrad)">
    <tspan dx="340">Arduino Core</tspan>
  </text>

  <!-- subtitle -->
  <text x="72" y="248" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#cbd5e1">
    ESP32-style Arduino API on the Bouffalo BL602 RISC-V SoC
  </text>

  <!-- spec chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="70" y="286" width="182" height="34" rx="17" fill="#17324d" stroke="#2c5580" stroke-width="1.5"/>
    <text x="161" y="308" text-anchor="middle" fill="#7dd3fc">RISC-V RV32IMFC</text>

    <rect x="266" y="286" width="104" height="34" rx="17" fill="#17324d" stroke="#2c5580" stroke-width="1.5"/>
    <text x="318" y="308" text-anchor="middle" fill="#7dd3fc">192 MHz</text>

    <rect x="384" y="286" width="196" height="34" rx="17" fill="#17324d" stroke="#2c5580" stroke-width="1.5"/>
    <text x="482" y="308" text-anchor="middle" fill="#7dd3fc">WiFi 802.11 b/g/n</text>

    <rect x="594" y="286" width="104" height="34" rx="17" fill="#17324d" stroke="#2c5580" stroke-width="1.5"/>
    <text x="646" y="308" text-anchor="middle" fill="#7dd3fc">BLE 5.0</text>

    <rect x="712" y="286" width="238" height="34" rx="17" fill="#17324d" stroke="#34d399" stroke-width="1.5"/>
    <text x="831" y="308" text-anchor="middle" fill="#34d399">Boards Manager install</text>
  </g>

  <!-- chip icon -->
  <g transform="translate(1008 106)">
    <!-- pcb -->
    <rect width="196" height="148" rx="16" fill="#0b1830" stroke="#2a4569" stroke-width="2.5"/>
    <!-- pins left -->
    <g fill="#1e3a5f">
      <rect x="-10" y="20" width="12" height="7" rx="2"/>
      <rect x="-10" y="44" width="12" height="7" rx="2"/>
      <rect x="-10" y="68" width="12" height="7" rx="2"/>
      <rect x="-10" y="92" width="12" height="7" rx="2"/>
    </g>
    <!-- pins right -->
    <g fill="#1e3a5f">
      <rect x="194" y="20" width="12" height="7" rx="2"/>
      <rect x="194" y="44" width="12" height="7" rx="2"/>
      <rect x="194" y="68" width="12" height="7" rx="2"/>
      <rect x="194" y="92" width="12" height="7" rx="2"/>
    </g>
    <!-- die -->
    <rect x="42" y="34" width="112" height="60" rx="8" fill="#122441" stroke="#2c5580" stroke-width="1.5"/>
    <text x="98" y="74" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">BL602</text>
    <!-- traces -->
    <path d="M48 118 H76 V108 H120 V118 H148" fill="none" stroke="#1e3a5f" stroke-width="2"/>
    <path d="M70 18 V30" stroke="#1e3a5f" stroke-width="2"/>
    <path d="M126 18 V30" stroke="#1e3a5f" stroke-width="2"/>
    <!-- LED -->
    <circle cx="172" cy="120" r="8" fill="#34d399">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="172" cy="120" r="13" fill="#34d399" opacity="0.18">
      <animate attributeName="opacity" values="0.22;0.05;0.22" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="172" y="141" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5c6b7a">LED</text>
  </g>
</svg>
